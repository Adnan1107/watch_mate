
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard - Chrono Space</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Poppins", sans-serif;
    }

    body {
      background: #000;
      color: #fff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 20px;
    }

    h1 {
      color: #ffcc00;
      margin-bottom: 30px;
      font-size: 2rem;
      letter-spacing: 1px;
      text-align: center;
    }

    .admin-container {
      background: #111;
      padding: 30px;
      border-radius: 20px;
      box-shadow: 0 0 15px rgba(255, 204, 0, 0.2);
      width: 100%;
      max-width: 600px;
      transition: transform 0.3s, box-shadow 0.3s;
    }

    .admin-container:hover {
      transform: translateY(-5px);
      box-shadow: 0 0 25px rgba(255, 204, 0, 0.4);
    }

    form {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    label {
      color: #ffcc00;
      font-weight: bold;
      transition: 0.3s;
    }

    label:hover {
      background: linear-gradient(to right, #ffcc00, #fff700);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    input, textarea {
      background: #222;
      border: 1px solid #555;
      color: #fff;
      border-radius: 8px;
      padding: 10px;
      font-size: 16px;
      transition: all 0.3s ease;
    }

    input:hover, textarea:hover {
      background: #333;
      transform: scale(1.02);
    }

    input:focus, textarea:focus {
      border-color: #ffcc00;
      outline: none;
      background: #222;
    }

    .image-preview {
      width: 100%;
      height: 200px;
      background: #333;
      border-radius: 10px;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      border: 1px dashed #ffcc00;
      margin-top: 10px;
    }

    .image-preview img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    button {
      background: #ffcc00;
      color: #111;
      padding: 12px;
      font-size: 16px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      font-weight: bold;
      transition: all 0.3s ease;
    }

    button:hover {
      background: #ffdb4d;
      transform: scale(1.05);
      box-shadow: 0 0 15px rgba(255, 204, 0, 0.6);
    }

    a {
      text-align: center;
      margin-top: 20px;
      color: #ffcc00;
      text-decoration: none;
      display: block;
      transition: 0.3s;
    }

    a:hover {
      color: #fff700;
      text-shadow: 0 0 8px #ffcc00;
    }

    @media (max-width: 600px) {
      .admin-container {
        padding: 20px;
      }
    }
  </style>
</head>
<body>

  <h1>Admin Dashboard - Chrono Space</h1>

  <div class="admin-container">
   <form method="POST" enctype="multipart/form-data">
  {% csrf_token %}
  <label for="watchName">Watch Name:</label>
  <input type="text" id="watchName" name="watch_name" placeholder="Enter watch name" required>

  <label for="brand">Brand:</label>
  <input type="text" id="brand" name="brand" placeholder="Enter brand name" required>

  <label for="price">Price (₹):</label>
  <input type="number" id="price" name="price" placeholder="Enter price" required>

  <label for="stock">Stock:</label>
  <input type="number" id="stock" name="stock" placeholder="Enter number of watches in stock" min="0" required>

  <label for="description">Description:</label>
  <textarea id="description" name="description" rows="3" placeholder="Short description" required></textarea>

  <label for="image">Upload Watch Image:</label>
  <input type="file" id="image" name="image" accept="image/*" onchange="previewImage(event)" required>

  <div class="image-preview" id="imagePreview">
    <span>Image preview will appear here</span>
  </div>

  <button type="submit">Add Watch</button>
</form>

  </div>

  <a href="{% url 'home' %}">← Back to Home</a>

  <script>
    function previewImage(event) {
      const imagePreview = document.getElementById('imagePreview');
      imagePreview.innerHTML = '';
      const img = document.createElement('img');
      img.src = URL.createObjectURL(event.target.files[0]);
      imagePreview.appendChild(img);
    }
  </script>
  <div>
    <a href="{% url 'home' %}" style="display:block; text-align:center; margin:40px auto; color:#ffcc00; text-decoration:none; font-size:18px;">&larr; Back to Home</a>
  </div>
 
</body>
</html>

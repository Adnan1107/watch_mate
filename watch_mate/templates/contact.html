<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us - Crono Space</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Arial', sans-serif; }
    body { background: #070707; color: #fff; }
    a { color: #ffcc00; text-decoration: none; }
    a:hover { text-decoration: underline; }

    .contact-hero {
      height: 50vh;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      background: url("https://images.unsplash.com/photo-1598300054415-857c334aff44?auto=format&fit=crop&w=1470&q=80") center/cover no-repeat;
      filter: brightness(0.6);
    }
    .contact-hero h1 { position: relative; z-index: 2; font-size: clamp(32px, 5vw, 60px); color: #ffcc00; }

    .contact-section {
      padding: 60px 20px;
      max-width: 900px;
      margin: auto;
      display: flex;
      flex-direction: column;
      gap: 40px;
    }

    .contact-info, .contact-form {
      background: #111;
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }

    .contact-info h2, .contact-form h2 {
      color: #ffcc00;
      margin-bottom: 20px;
    }

    .contact-info p { margin-bottom: 10px; line-height: 1.6; }

    .contact-form form { display: flex; flex-direction: column; gap: 20px; }
    .contact-form input, .contact-form textarea {
      padding: 12px;
      border-radius: 8px;
      border: none;
      font-size: 16px;
    }
    .contact-form button {
      padding: 12px;
      background: #ffcc00;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.3s;
    }
    .contact-form button:hover {
      background: #e6b800;
    }

    @media (max-width: 768px) {
      .contact-section { padding: 40px 10px; }
    }
  </style>
</head>
<body>

  <!-- HERO / BANNER -->
  <section class="contact-hero">
    <h1>Contact Crono Space</h1>
  </section>

  <!-- CONTACT SECTION -->
  <section class="contact-section">

    <!-- CONTACT INFO -->
    <div class="contact-info">
      <h2>Our Contact Information</h2>
      <p><strong>Address:</strong> 123 Watch Street, Mumbai, India</p>
      <p><strong>Phone:</strong> +91 98765 43210</p>
      <p><strong>Email:</strong> support@cronospace.com</p>
      <p><strong>Business Hours:</strong> Mon-Fri 10:00 AM - 7:00 PM</p>
    </div>

    <!-- CONTACT FORM -->
    <div class="contact-form">
      <h2>Send Us a Message</h2>
      <form action="#" method="post">
        <input type="text" name="name" placeholder="Your Name" required>
        <input type="email" name="email" placeholder="Your Email" required>
        <input type="text" name="subject" placeholder="Subject" required>
        <textarea name="message" rows="6" placeholder="Your Message" required></textarea>
        <button type="submit">Send Message</button>
      </form>
    </div>

  </section>
  <div>
    <a href="{% url 'home' %}" style="display:block; text-align:center; margin:40px auto; color:#ffcc00; text-decoration:none; font-size:18px;">&larr; Back to Home</a>

</body>
</html>

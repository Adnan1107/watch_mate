{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Signup - Crono Space</title>
<style>
  /* RESET */
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }

  body {
    background: #070707;
    color: #fff;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
  }

  /* CONTAINER */
  .signup-container {
    background: #111;
    padding: 40px;
    border-radius: 20px;
    width: 100%;
    max-width: 400px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.7);
    transition: transform 0.3s, box-shadow 0.3s;
  }

  /* Container hover: lift + shadow */
  .signup-container:hover {
    transform: translateY(-5px);
    box-shadow: 0 15px 35px rgba(0,0,0,0.9);
  }

  /* HEADING */
  .signup-container h2 {
    text-align: center;
    color: #ffcc00;
    margin-bottom: 30px;
    transition: color 0.3s;
  }

  /* Heading hover */
  .signup-container h2:hover {
    color: #ff9900;
  }

  /* LABELS */
  .signup-container label {
    display: block;
    margin-bottom: 8px;
    color: #ffcc00;
    font-weight: bold;
    transition: color 0.3s;
  }

  /* Label hover */
  .signup-container label:hover {
    color: #ff9900;
  }

  /* INPUTS */
  .signup-container input {
    width: 100%;
    padding: 12px;
    margin-bottom: 20px;
    border-radius: 15px;
    border: none;
    outline: none;
    background: #222;
    color: #fff;
    transition: background 0.3s, transform 0.3s;
  }

  /* Input hover & focus: darker + scale */
  .signup-container input:hover,
  .signup-container input:focus {
    background: #333;
    transform: scale(1.02);
  }

  /* BUTTON */
  .signup-container button {
    width: 100%;
    padding: 12px;
    border: none;
    border-radius: 20px;
    background: linear-gradient(90deg, #ffcc00, #ff9900);
    color: #111;
    font-weight: bold;
    cursor: pointer;
    transition: transform 0.3s, background 0.3s, box-shadow 0.3s;
  }

  /* Button hover: glow + scale */
  .signup-container button:hover {
    background: linear-gradient(90deg, #e6b800, #ffcc00);
    transform: scale(1.05);
    box-shadow: 0 5px 15px rgba(255,204,0,0.6);
  }

  /* FOOTER */
  .signup-footer {
    text-align: center;
    margin-top: 20px;
    color: #aaa;
    transition: color 0.3s;
  }

  /* Footer link hover: brighter yellow */
  .signup-footer a {
    color: #ffcc00;
    text-decoration: none;
    transition: color 0.3s;
  }

  .signup-footer a:hover {
    color: #ff9900;
    text-decoration: underline;
  }

</style>
</head>
<body>
  <div class="signup-container">
    <h2>Create Account</h2>
    <form method="POST" action="{% url 'signup' %}">
      {% csrf_token %}
      <label for="name">Name</label>
      <input type="text" name="name" id="name" placeholder="Your Name" required>

      <label for="email">Email</label>
      <input type="email" name="email" id="email" placeholder="Your Email" required>

      <label for="password">Password</label>
      <input type="password" name="password" id="password" placeholder="Password" required>

      <button type="submit">Sign Up</button>
    </form>
    <div class="signup-footer">
      Already have an account? <a href="{% url 'login' %}">Login</a>
    </div>
  </div>

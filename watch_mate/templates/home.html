{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Crono Space</title>
<style>
/* ===== RESET ===== */
* { margin:0; padding:0; box-sizing:border-box; font-family:'Arial', sans-serif; }

/* ===== BODY ===== */
body { background:#070707; color:#fff; }

/* ===== NAVBAR ===== */
nav {
  display:flex; justify-content:space-between; align-items:center;
  padding:15px 50px; background:#000; position:sticky; top:0; z-index:1000;
}
.nav-left {
  font-size:28px; font-weight:bold; letter-spacing:2px;
  background:linear-gradient(90deg,#ffae00,#690000);
  -webkit-background-clip:text; -webkit-text-fill-color:transparent;
  cursor:pointer;
}
.nav-center ul { list-style:none; display:flex; gap:30px; }
.nav-center ul li a { text-decoration:none; color:#fff; font-weight:500; transition:0.3s; }
.nav-center ul li a:hover { color:#ffcc00; }
.nav-right { display:flex; align-items:center; gap:15px; }
.nav-right input { padding:6px 12px; border-radius:20px; border:none; outline:none; }
.cart { font-size:24px; cursor:pointer; transition:0.2s; }
.cart:hover { transform:scale(1.2); }
.login-btn {
  padding:8px 18px; border:none; border-radius:20px;
  background:#ffcc00; color:#111; font-weight:bold; cursor:pointer; transition:0.3s;
}
.login-btn:hover { background:#e6b800; transform:scale(1.1); box-shadow:0 0 12px rgba(255,204,0,0.7); }

/* ===== HERO ===== */
.hero { position:relative; width:100%; height:80vh; display:flex; justify-content:center; align-items:center; text-align:center; }
.hero::before {
  content:''; position:absolute; inset:0; background:url("{% static 'images/w2.jpg' %}") center/cover no-repeat; filter:brightness(0.7); z-index:1; animation:zoom 15s ease-in-out infinite alternate;
}
@keyframes zoom { from{transform:scale(1);} to{transform:scale(1.1);} }
.hero-overlay { position:relative; z-index:2; display:flex; flex-direction:column; justify-content:center; align-items:center; padding:20px; }
.hero-overlay h1, .hero-overlay p { color:#ffcc00; font-weight:bold; margin-bottom:20px; font-size:clamp(24px,4vw,48px); min-height:50px; }
.hero-overlay p { font-size:clamp(16px,2vw,24px); color:#fff; }
.hero-btn { padding:14px 28px; border:none; border-radius:30px; background:#ffcc00; font-weight:bold; cursor:pointer; transition:0.3s; }
.hero-btn:hover { background:#e6b800; transform:scale(1.1); }

/* ===== PRODUCTS ===== */
.products { padding:30px 20px; text-align:center; background:#000; }
.section-title { font-size:36px; margin-bottom:50px; font-weight:bold; letter-spacing:1px; position:relative; color:#ffcc00; }
.section-title::after { content:''; width:60px; height:4px; background:linear-gradient(90deg,#ffcc00,#ff6600); display:block; margin:10px auto 0; border-radius:2px; transition:0.3s; }
.section-title:hover::after { width:100px; }
.product-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:30px; perspective:1500px; }
.product-card {
  /* background:linear-gradient(145deg,#fff,#e6e6e6); border-radius:20px; padding:20px; */
  box-shadow:0 12px 25px rgba(0,0,0,0.1); transition:transform 0.6s ease, box-shadow 0.6s ease; transform-style:preserve-3d; cursor:pointer;
}
.product-card {
  width: 220px;               /* Reduced size */
  border-radius: 12px;
  padding: 12px;
  text-align: center;
  box-shadow: 0 6px 15px rgba(0,0,0,0.1);
  transition: transform 0.4s ease, box-shadow 0.4s ease;
}

.product-card img {
  width: 260px;               /* Reduced size */
  height: 360px;              /* Reduced height for compact look */
  object-fit: cover;
  border-radius: 18px;
  margin-bottom: 18px;
  transition: transform 0.6s ease;
}

.product-card h3 {
  font-size: 16px;            /* Smaller text */
  margin-bottom: 6px;
  color: #222;
}

.product-card p {
  font-size: 14px;
  font-weight: bold;
  color: #ff6600;
  margin-bottom: 10px;
}

.product-card button {
  padding: 8px 18px;
  border: none;
  border-radius: 25px;
  background: linear-gradient(90deg, #ffcc00, #ff6600);
  color: #111;
  font-weight: bold;
  cursor: pointer;
  transition: transform 0.3s, background 0.3s;
  font-size: 13px;
}

.product-card:hover {
  transform: rotateY(6deg) rotateX(3deg) translateY(-10px) scale(1.03);
  box-shadow: 0 15px 30px rgba(0,0,0,0.25);
}

.product-card:hover img {
  transform: scale(1.05) rotateZ(-1deg);
}

.product-card button:hover {
  background: linear-gradient(90deg, #e6b800, #ff9900);
  transform: scale(1.08) rotateZ(-1deg);
}


/* ===== SLIDESHOW ===== */
.slideshow { position:relative; width:100%; height:70vh; overflow:hidden; margin-top:60px; }
.slides { display:none; height:100%; }
.slide-container { display:flex; width:100%; height:100%; }
.slide-image, .slide-content { width:50%; height:100%; }
.slide-image img { width:100%; height:100%; object-fit:cover; filter:brightness(70%); }
.slide-content { display:flex; flex-direction:column; justify-content:center; padding:50px; background:#111; color:#fff; }
.slide-content h2 { font-size:40px; margin-bottom:20px; }
.slide-content p { font-size:20px; margin-bottom:25px; }
.slide-content button { padding:12px 25px; border-radius:30px; border:none; background:#ffcc00; cursor:pointer; font-weight:bold; transition:0.3s; }
.slide-content button:hover { background:#e6b800; transform:scale(1.05); }
.prev, .next {
  position:absolute; top:50%; transform:translateY(-50%); padding:12px; font-size:24px;
  cursor:pointer; background:rgba(0,0,0,0.4); border-radius:50%; user-select:none; transition:0.3s;
}
.prev:hover, .next:hover { background:rgba(0,0,0,0.7); }
.prev { left:15px; } .next { right:15px; }
.dots { text-align:center; position:absolute; bottom:15px; width:100%; }
.dot { cursor:pointer; height:14px; width:14px; margin:0 5px; background:#bbb; border-radius:50%; display:inline-block; transition:0.3s; }
.active, .dot:hover { background:#ffcc00; }

/* ===== RESPONSIVE ===== */
@media(max-width:768px){
  nav{flex-direction:column; gap:10px;}
  .nav-center ul{flex-direction:column; gap:10px;}
  .section-title{font-size:28px;}
  .product-card h3{font-size:20px;}
  .product-card p{font-size:16px;}
  .product-card button{font-size:16px; padding:10px 20px;}
  .slide-content h2{font-size:28px;}
  .slide-content p{font-size:16px;}
}
</style>
</head>
<body>

<!-- NAVBAR -->
<nav>
  <div class="nav-left">Crono Space</div>
  <div class="nav-center">
    <ul>
      <li><a href="{% url 'About' %}">About</a></li>
      <li><a href="{% url 'brand' %}">Brand</a></li>
      <li><a href="{% url 'guide' %}">Repair Guide</a></li>
      <li><a href="{% url 'contact' %}">Contact</a></li>
    </ul>
  </div>
  <div class="nav-right">
    <input type="text" placeholder="Search...">
  <div class="cart">🛒</div>
   <a href="{% url 'login' %}"> <button class="login-btn">Login</button></a>
  </div>
</nav>

<!-- HERO -->
<section class="hero">
  <div class="hero-overlay">
    <h1 id="hero-title"></h1>
    <p id="hero-subtitle"></p>
    <a href="/shop"><button class="hero-btn">Explore Now</button></a>
  </div>
</section>

<!-- PRODUCTS -->
<section class="products">
  <h2 class="section-title">Our Products</h2>
  <div class="product-grid">
    <div class="product-card">
      <img src="{% static 'images/w1.jpg' %}" alt="Watches">
      <h3>Watches </h3>
    </div>
    <div class="product-card">
      <img src="{% static 'images/w4.jpg' %}" alt="Accessories">
      <h3>Accessories</h3>
    </div>
    <div class="product-card">
      <img src="{% static 'images/w5.jpg' %}" alt="Matching Items">
      <h3>Matching Items</h3>
    </div>
    <div class="product-card">
      <img src="{% static 'images/rep.jpg' %}" alt="Tools">
      <h3>Tools</h3>
    </div>
  </div>
</section>

<!-- SLIDESHOW -->
<section class="slideshow">
  <div class="slides fade">
    <div class="slide-container">
      <div class="slide-image"><img src="{% static 'images/w9.jpg' %}" alt="Watches"></div>
      <div class="slide-content">
        <h2>Exclusive Watches</h2>
        <p>Flat 30% Off This Week!</p>
        <button>Shop Now</button>
      </div>
    </div>
  </div>
  <div class="slides fade">
    <div class="slide-container">
      <div class="slide-image"><img src="{% static 'images/w7.jpg' %}" alt="Watches"></div>
      <div class="slide-content">
        <h2>Stylish Straps</h2>
        <p>Buy 1 Get 1 Free</p>
        <button>Explore </button>
      </div>
    </div>
  </div>
  <div class="slides fade">
    <div class="slide-container">
      <div class="slide-image"><img src="{% static 'images/w8.jpg' %}" alt="Watches"></div>
      <div class="slide-content">
        <h2>Branded Watches</h2>
        <p>Up to 50% Off</p>
        <button>Grab Now</button>
      </div>
    </div>
  </div>
  <a class="prev" onclick="plusSlides(-1)">&#10094;</a>
  <a class="next" onclick="plusSlides(1)">&#10095;</a>
  <div class="dots">
    <span class="dot" onclick="currentSlide(1)"></span>
    <span class="dot" onclick="currentSlide(2)"></span>
    <span class="dot" onclick="currentSlide(3)"></span>
  </div>
</section>

<!-- ===== JS ===== -->
<script>
// ===== Typing Animation =====
const heroTitle = "Find quality watch spare parts & repair services";
const heroSubtitle = "Your trusted partner for premium watches";

function typeText(elementId, text, speed=50, callback=null){
  let i = 0;
  const el = document.getElementById(elementId);
  el.innerHTML = "";
  const timer = setInterval(() => {
    el.innerHTML += text.charAt(i);
    i++;
    if(i >= text.length){ clearInterval(timer); if(callback) callback(); }
  }, speed);
}

typeText("hero-title", heroTitle, 50, () => typeText("hero-subtitle", heroSubtitle, 40));

// ===== Slideshow =====
let slideIndex = 1; showSlides(slideIndex);
function plusSlides(n){ showSlides(slideIndex += n); }
function currentSlide(n){ showSlides(slideIndex = n); }
function showSlides(n){
  let slides = document.getElementsByClassName("slides");
  let dots = document.getElementsByClassName("dot");
  if(n>slides.length) slideIndex=1;
  if(n<1) slideIndex=slides.length;
  for(let i=0;i<slides.length;i++) slides[i].style.display="none";
  for(let i=0;i<dots.length;i++) dots[i].className=dots[i].className.replace(" active","");
  slides[slideIndex-1].style.display="block";
  dots[slideIndex-1].className += " active";
}
setInterval(()=>{ plusSlides(1); }, 5000);
</script>
</body>
</html>
